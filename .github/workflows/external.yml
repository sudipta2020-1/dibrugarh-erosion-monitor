name: External accuracy check

# Checks the three water and bank-change methods against labelled data they did
# not produce: Dynamic World expert-labelled Sentinel-2 tiles and the REAL global
# riverbank erosion dataset. Results go to docs/data/external/.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which test to run: all, test1 (Dynamic World tiles) or test2 (REAL reaches)"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: external-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt scikit-image

      - name: Restore downloaded reference data
        uses: actions/cache/restore@v4
        with:
          path: outputs/external
          key: external-data-v1-${{ github.run_id }}
          restore-keys: external-data-v1-

      # Zenodo downloads are large and sometimes break; curl resumes them
      - name: Download reference data
        run: |
          mkdir -p outputs/external
          cd outputs/external
          Z=https://zenodo.org/api/records
          C="curl -sS -L --fail --retry 20 --retry-all-errors --retry-delay 20 --speed-limit 20000 --speed-time 60 -C -"
          $C -o dw_tiles.zip "$Z/4766451/files/dw_expert_consensus_tiles.zip/content"
          for f in REAL_reach.prj REAL_reach.shx REAL_reach.dbf REAL_reach.shp; do
            for k in 1 2 3 4 5 6; do
              $C -o "$f" "$Z/7045021/files/$f/content" && break
              echo "attempt $k for $f failed"; sleep 60
            done
          done
          ls -la

      - name: Save reference data in the cache
        if: always() && hashFiles('outputs/external/REAL_reach.dbf') != ''
        uses: actions/cache/save@v4
        with:
          path: outputs/external
          key: external-data-v1-${{ github.run_id }}

      - name: Run the external checks
        env:
          PYTHONUNBUFFERED: "1"
        run: python pipeline/external_validation.py "${{ github.event.inputs.which || 'all' }}"

      - name: Commit results
        run: |
          git config user.name  "erosion-monitor-bot"
          git config user.email "erosion-monitor-bot@users.noreply.github.com"
          git add docs/data/external
          git commit -m "External accuracy check" || echo "No changes"
          git pull --rebase
          git push
