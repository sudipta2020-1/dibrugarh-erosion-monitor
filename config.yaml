# Configuration for the Dibrugarh soil erosion monitoring dashboard.

project_name: dibrugarh_district

# Study area. A copy of the Dibrugarh district polygon (geoBoundaries, India ADM2)
# is stored in this repository, so runs do not depend on an online download.
# Replace the file with the department's own boundary if preferred.
aoi_district: Dibrugarh
aoi_geojson: data/dibrugarh_boundary.geojson
aoi_bbox: [94.55, 27.05, 95.45, 27.75]   # fallback only

crs: "EPSG:32646"     # UTM zone 46N
resolution_m: 20

# Monitoring windows.
# mode: rolling -> every run compares the most recent `window_days` with the
#                  same calendar dates in `baseline_year`. Comparing the same
#                  months keeps seasonal river level and crop differences small.
# mode: fixed   -> use period_baseline and period_current below.
monitoring:
  mode: rolling
  window_days: 120
  baseline_year: 2020

period_baseline: ["2019-11-01", "2020-02-28"]
period_current:  ["2025-11-01", "2026-02-28"]

max_cloud_cover: 40
# Only the clearest scenes of each Sentinel-2 tile are used for a composite.
# This keeps a run well within the satellite archive's access-token lifetime.
max_scenes_per_tile: 15
# Runs whose current optical composite covers less than this share of the
# district (monsoon months) are published but flagged as low confidence.
min_clear_coverage_pct: 60

# RUSLE inputs. The rasters are built once by the "Prepare static inputs"
# workflow (pipeline/prepare_inputs.py). Until they exist, the constants are used.
rusle:
  rainfall_raster: data/rainfall_imd_mean_annual.tif   # IMD 0.25 deg, mean annual (mm)
  annual_rainfall_mm: 2500                              # fallback only
  k_raster: data/k_factor_soilgrids.tif                 # SoilGrids + Williams EPIC
  k_factor: 0.025                                       # fallback only (t ha h / ha MJ mm)
  p_factor: 1.0
  dem_smooth_m: 100        # removes canopy and building noise from the surface DEM

# Historical bank erosion, JRC Global Surface Water transitions 1984-2021
history_raster: data/jrc_gsw_transitions.tif

risk_thresholds: [5, 10, 20, 40]

change:
  # Water mapping. The two values below are only first guesses: the thresholds
  # actually used are found by edge-based Otsu within the given bounds.
  mndwi_water: 0.0
  mndwi_bounds: [-0.3, 0.3]
  sar_water_db: -16.0
  sar_bounds: [-22.0, -13.0]
  # A pixel is water if it was water on at least this share of its clear dates
  water_frequency_min: 0.5
  min_observations: 2
  # Land-to-water change counts as bank erosion only if it touches a water body
  # of at least this size (river channels); other cases are new ponds or flooding.
  river_min_area_ha: 50
  bank_touch_px: 2
  ndvi_loss: -0.15
  min_patch_pixels: 10

# Accuracy assessment. A stratified random sample is drawn once and written to
# docs/data/validation/. Label the points on docs/validate.html, save the CSV as
# data/validation_labels.csv, and rerun with the sample's end date.
validation:
  enabled: true
  seed: 42
  sample_per_stratum: {1: 50, 5: 50, 2: 50, 6: 30, 10: 75, 11: 75}
  labels: data/validation_labels.csv

# Machine-learning bank-erosion susceptibility (Random Forest + XGBoost).
# Trained on baseline conditions -> bank loss observed by the current window,
# checked by spatial block cross-validation, compared with RUSLE.
ml:
  enabled: true
  seed: 42
  sample_size: 150000      # training pixels drawn at random from the study zone
  max_distance_m: 3000     # zone: land within this distance of a river channel
  cv_blocks: 6             # blocks along the river for spatial cross-validation
  site_tile_m: 1000        # AI high-susceptibility zones are listed as tiles of this size

# Exposure of people and assets around each priority site (layers built by
# "Prepare static inputs" with the exposure step). priority = hazard x
# (floor + (1 - floor) x exposure index).
exposure:
  buffer_m: 500
  floor: 0.3
  saturation: {population: 2000, built_ha: 10, crop_ha: 40, road_km: 3, embankment_km: 1, facilities: 2}
  weights: {population: 0.35, built_ha: 0.15, crop_ha: 0.15, road_km: 0.1, embankment_km: 0.1, facilities: 0.15}

# Places in the 50-site priority list kept for each kind of evidence
site_quota: {change: 30, ai: 15, risk: 5}

output_dir: outputs        # working files (not committed)
publish_dir: docs/data     # files served by GitHub Pages

# Recommended measures for each priority site (see pipeline/interventions.py)
interventions:
  people_high: 500            # people within 500 m that make bank erosion urgent
  retreat_fast_m_per_yr: 50
  exposure_high: 0.4
  slope_steep_deg: 8

# Field verification: export the KoboToolbox / ODK records as CSV and save them
# as data/field_records.csv; each run matches them to the priority sites.
field:
  records: data/field_records.csv
  match_m: 300
